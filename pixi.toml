[workspace]
name = "product-monorepo"
version = "0.1.0"
channels = ["https://prefix.dev/archont561/archont561", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# ---------------------------------------------------------------------------
# Single automation entrypoint (enforced by .alint/schemas/pixi-tasks.schema.json)
# All repo and agent automation runs via `pixi run tools ...` (Tasknest).
# ---------------------------------------------------------------------------

[tasks]
tools = "bun x --bun --no-install tasknest"

# ---------------------------------------------------------------------------
# Split features — dependencies only (no feature tasks; use grouped modules under `tools/`)
# ---------------------------------------------------------------------------

[feature.js.dependencies]
bun = ">=1.4,<2"

[feature.python.dependencies]
python = ">=3.12,<3.14"

[feature.lint.dependencies]
actionlint = "*"
convco = "*"
lychee = "*"
taplo = "*"

[feature.lint.target.unix.dependencies]
lefthook = "*"
shellcheck = "*"

[feature.lint.pypi-dependencies]
alint = "==0.22.1"
vale = "==3.27.0.0"
gherlint = "==0.5.0"
rumdl = "==0.3.4"

[feature.docs.dependencies]
jinja2 = "*"

[feature.sandbox.dependencies]
pixi-sandbox = "=0.9.0"

[feature.rust.dependencies]
rust = "*"
cargo-nextest = "*"
cargo-llvm-cov = "*"
cargo-deny = "*"
cargo-audit = "*"
wasm-bindgen-cli = "*"
binaryen = "*"

# ---------------------------------------------------------------------------
# Split environments — every environment includes `js` so `pixi run tools`
# works uniformly across all lanes
# ---------------------------------------------------------------------------

[environments]
default = { features = ["js", "python", "lint", "sandbox"], solve-group = "default" }
js = { features = ["js"], solve-group = "default" }
lint = { features = ["js", "python", "lint"], solve-group = "default" }
docs = { features = ["js", "python", "lint", "docs"], solve-group = "default" }
rust = { features = ["js", "rust"], solve-group = "rust" }
full = { features = ["js", "python", "lint", "docs", "sandbox", "rust"], solve-group = "rust" }
