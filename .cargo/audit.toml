# cargo-audit 0.22+ RustSec advisory policy (auto-discovered at .cargo/audit.toml)

[advisories]
ignore = []
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = ["unsound", "yanked"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
