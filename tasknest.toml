# Workspace configuration for Tasknest 0.4.0.
# All repository & coding-agent automation runs through `pixi run tools ...`.
[tasknest]
config_version = 1

[discovery]
workspaces = false

[[discovery.roots]]
path = "tools"
namespace = ""
project_root = "."

[[discovery.roots]]
path = "apps/web/tools"
namespace = "web"
project_root = "apps/web"

[[discovery.roots]]
path = "apps/mobile/tools"
namespace = "mobile"
project_root = "apps/mobile"

[[discovery.roots]]
path = "apps/extension/tools"
namespace = "ext"
project_root = "apps/extension"

[[discovery.roots]]
path = "apps/worker/tools"
namespace = "worker"
project_root = "apps/worker"

# Manifest-backed app tasks: `dev`/`build` are already declared as package.json scripts, so
# Tasknest discovers them instead of a hand-written wrapper. Task metadata (description, marks,
# persistent, requires) lives in each app's `tasknest.tasks` table.
[[discovery.manifests]]
path = "apps/desktop"
runner = "bun"

[[discovery.manifests]]
path = "apps/docs"
runner = "bun"

[[discovery.manifests]]
path = "apps/worker"
runner = "bun"
# `deploy` keeps its typed `--env` flag (apps/worker/tools/deploy.ts); `typecheck` and `test` run
# through `pixi run tools run --each typecheck` and the package-scoped selectors instead.
exclude_scripts = ["deploy", "test", "typecheck"]

# Manifest-backed package scripts (enables `pixi run tools run --each typecheck`,
# `pixi run tools run -p pkg.contracts test`, etc.)
[[discovery.manifests]]
path = "packages/*"
namespace = "pkg"
runner = "bun"

[[discovery.manifests]]
path = "packages/frontend/*"
namespace = "pkg"
runner = "bun"

[[discovery.manifests]]
path = "packages/infrastructure/*"
namespace = "pkg.infra"
runner = "bun"

[checks]
strict = true
require_description = true
require_tests = false
require_features = false
unknown_marks = "error"

[marks]
fast = "Fast local check suitable for tight feedback loops"
offline = "Runs fully offline without network access"
lint = "Static analysis, formatting, schema, or boundary verification"
test = "Automated unit or integration test suite"
rust = "Requires the Pixi `rust` environment (`pixi run -e rust tools ...`)"
security = "Supply-chain license, ban, or vulnerability advisory audit"
docs = "Documentation prose or site verification"
setup = "Workspace dependency bootstrap or installation"
workflow = "Backlog, agent skill, or developer workflow utility"
ci = "CI/CD helper: change detection and repository layout policy for GitHub Actions"
dev = "Long-running development server or watcher"
build = "Compile or package deployable artifacts"
release = "Packaging or deployment workflow for staging/production"
codegen = "Generated contract, OpenAPI, or artifact emitter"

[execution]
jobs = 1
