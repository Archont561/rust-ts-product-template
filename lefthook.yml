# Lefthook v2 Git hooks — all checks route through the single `pixi run tools` entrypoint.
# Install locally with: `pixi run tools run workflow hooks`
# Validate syntax with: `pixi run tools run workflow hooks --action validate`

commit-msg:
  jobs:
    - name: convco
      run: pixi run tools run workflow commit-msg {1}

pre-commit:
  parallel: true
  jobs:
    - name: lint-actions
      glob: "{.github/workflows/*.yml,.github/actions/**}"
      run: pixi run tools run quality lint-actions

    - name: lint-toml
      glob: "**/*.toml"
      run: pixi run tools run quality lint-toml

    - name: lint-ts
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,svelte,json,jsonc,css}"
      run: pixi run tools run quality lint-ts

    - name: lint-md
      glob: "**/*.{md,mdx}"
      run: pixi run tools run quality lint-md

    - name: check-layout
      glob: ".github/**"
      run: pixi run tools run ci check-layout

    - name: lint-repo
      run: pixi run tools run quality lint-repo

    - name: test-policy
      glob: "{.alint.yml,.alint/**}"
      run: pixi run tools run testing test-policy

    - name: tasknest-sync
      glob: "{tasknest.toml,tools/**,apps/*/tools/**}"
      run: pixi run tools check

    - name: docs-sync
      glob: "{templates/**,README.md,AGENTS.md,.github/ISSUE_TEMPLATE/**,.github/PULL_REQUEST_TEMPLATE.md,.alint/schemas/**,.alint/tests/**,package.json,Cargo.toml}"
      run: pixi run tools run documentation sync

    - name: lint-gherkin
      glob: "**/*.feature"
      run: pixi run tools run quality lint-gherkin

    - name: links
      glob: "**/*.{md,mdx}"
      run: pixi run tools run quality links

    - name: lint-prose
      glob: "{README.md,AGENTS.md,backlog/README.md}"
      run: pixi run tools run quality lint-prose

pre-push:
  parallel: true
  jobs:
    - name: typecheck-ts
      glob: "{packages/**,apps/**,tsconfig*.json,package.json}"
      run: pixi run tools run --each typecheck

    - name: test-ts
      glob: "{packages/**,apps/**,package.json,bun.lock}"
      run: pixi run tools run testing test-ts

    - name: rust-checks
      glob: "{Cargo.toml,Cargo.lock,clippy.toml,deny.toml,rust/**,apps/web/**}"
      group:
        piped: true
        jobs:
          - name: lint-rust
            run: pixi run -e rust tools run quality lint-rust
          - name: test-rust
            run: pixi run -e rust tools run testing test-rust
          - name: deny-rust
            run: pixi run -e rust tools run security deny
