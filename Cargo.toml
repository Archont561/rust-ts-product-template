[workspace]
resolver = "3"
members = [
  "rust/crates/domain",
  "rust/crates/contracts",
  "rust/crates/services",
  "rust/crates/storage",
  "rust/crates/sync",
  "rust/adapters/wasm",
  "rust/adapters/axum",
  "rust/adapters/tauri",
  "apps/web",
]
# Native app composition roots carry target-specific SDKs (WebKitGTK, Android
# NDK, Xcode) and remain excluded; the portable Axum web app stays in this
# workspace so its locked third-party dependencies are tested and vendored.
exclude = [
  "apps/desktop/src-tauri",
  "apps/mobile/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
product-domain = { path = "rust/crates/domain" }
product-contracts = { path = "rust/crates/contracts" }
product-services = { path = "rust/crates/services" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Zero-panic production discipline (tests opt back in via clippy.toml)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# Async & I/O safety
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"

# Clean diagnostics & error types
result_large_err = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Ergonomic pedantic tuning
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
