[package]
name = "product-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
product-adapter-axum = { path = "../../rust/adapters/axum" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
utoipa = { version = "5", features = ["axum_extras"] }

[lints]
workspace = true
