test_version: 1
name: packages/domain importing application or platform SDKs fails
tags: [check, boundaries, typescript, failing]

docs:
  title: domain package rejects upper layers and platform SDKs
  case: fail
  kind: import_gate

given:
  tree:
    packages:
      domain:
        src:
          index.ts: |
            import { ProductClient } from "@product/application";
            export const leaked = ProductClient;
  config: |
    version: 1
    rules:
      - id: boundary-domain-is-leaf
        kind: import_gate
        language: js
        paths: "packages/domain/src/**/*.{ts,tsx}"
        forbid: "^(@product/(contracts|application|infrastructure-|ui|features|testing|build-utils|app-)|@tauri-apps/|@wxt-dev/|@webext-core/|@neondatabase/|cloudflare:|node:|svelte(/|$))"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: boundary-domain-is-leaf, level: error }
