test_version: 1
name: rust/crates/services importing axum fails
tags: [check, boundaries, rust, failing]

docs:
  title: rust services crate rejects transport SDK imports
  case: fail
  kind: import_gate

given:
  tree:
    rust:
      crates:
        services:
          src:
            lib.rs: |
              use axum::Json;
              pub fn leaked() -> Json<()> { Json(()) }
  config: |
    version: 1
    rules:
      - id: boundary-rust-services-no-transport-sdks
        kind: import_gate
        language: rust
        paths: "rust/crates/services/src/**/*.rs"
        forbid: "^(product_adapter_|axum|tauri|tauri_plugin_|wasm_bindgen|sqlx|rusqlite|tokio|reqwest)"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: boundary-rust-services-no-transport-sdks, level: error }
