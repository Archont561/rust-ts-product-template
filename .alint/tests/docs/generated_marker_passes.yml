test_version: 1
name: generated docs whose first line names their source template pass
tags: [check, docs, generated-marker, passing]

docs:
  title: every generated file advertises the template it is rendered from
  case: pass
  kind: file_header

given:
  tree:
    README.md: |
      <!-- generated from templates/README.md.j2 — do not edit by hand; regenerate with `pixi run tools run documentation sync --write` -->

      # Product Monorepo Template
    AGENTS.md: |
      <!-- generated from templates/AGENTS.md.j2 — do not edit by hand; regenerate with `pixi run tools run documentation sync --write` -->

      # Agent Instructions
    .github:
      PULL_REQUEST_TEMPLATE.md: |
        <!-- generated from templates/github/PULL_REQUEST_TEMPLATE.md.j2 — do not edit by hand; regenerate with `pixi run tools run documentation sync --write` -->

        # Pull Request
      ISSUE_TEMPLATE:
        bug_report.yml: |
          # generated from templates/github/ISSUE_TEMPLATE/bug_report.yml.j2 — do not edit by hand
          name: Bug report
        feature_request.yml: |
          # generated from templates/github/ISSUE_TEMPLATE/feature_request.yml.j2 — do not edit by hand
          name: Feature request
        config.yml: |
          # generated from templates/github/ISSUE_TEMPLATE/config.yml.j2 — do not edit by hand
          blank_issues_enabled: false
  config: |
    version: 1
    rules:
      - id: require-readme-generated-marker
        kind: file_header
        paths: README.md
        lines: 1
        pattern: '^<!-- generated from templates/README\.md\.j2\b[^\n]*-->\s*$'
        level: error
      - id: require-agents-generated-marker
        kind: file_header
        paths: AGENTS.md
        lines: 1
        pattern: '^<!-- generated from templates/AGENTS\.md\.j2\b[^\n]*-->\s*$'
        level: error
      - id: require-pr-template-generated-marker
        kind: file_header
        paths: .github/PULL_REQUEST_TEMPLATE.md
        lines: 1
        pattern: '^<!-- generated from templates/github/PULL_REQUEST_TEMPLATE\.md\.j2\b[^\n]*-->\s*$'
        level: error
      - id: require-bug-report-template-generated-marker
        kind: file_header
        paths: .github/ISSUE_TEMPLATE/bug_report.yml
        lines: 1
        pattern: '^# generated from templates/github/ISSUE_TEMPLATE/bug_report\.yml\.j2\b[^\n]*\s*$'
        level: error
      - id: require-feature-request-template-generated-marker
        kind: file_header
        paths: .github/ISSUE_TEMPLATE/feature_request.yml
        lines: 1
        pattern: '^# generated from templates/github/ISSUE_TEMPLATE/feature_request\.yml\.j2\b[^\n]*\s*$'
        level: error
      - id: require-issue-config-template-generated-marker
        kind: file_header
        paths: .github/ISSUE_TEMPLATE/config.yml
        lines: 1
        pattern: '^# generated from templates/github/ISSUE_TEMPLATE/config\.yml\.j2\b[^\n]*\s*$'
        level: error

when: [check]

expect:
  - exit: success
    violations: []
