test_version: 1
name: missing Product Vale vocabulary fails require-vale-config
tags: [check, docs, vale, failing]

docs:
  title: prose linting fails closed when the Product vocabulary is absent
  case: fail
  kind: file_exists

given:
  tree:
    .vale.ini: |
      StylesPath = .vale/styles
      Vocab = Product
  config: |
    version: 1
    rules:
      - id: require-vale-config
        kind: file_exists
        paths: .vale.ini
        level: error
      - id: require-vale-vocabulary
        kind: file_exists
        paths: .vale/styles/config/vocabularies/Product/accept.txt
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: require-vale-vocabulary, level: error }
