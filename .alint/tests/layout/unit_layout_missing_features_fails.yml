test_version: 1
name: a Rust crate missing features/*.feature fails rust-unit-layout
tags: [check, layout, rust, failing]

docs:
  title: workspace Rust crates fail layout check when BDD features are missing
  case: fail
  kind: for_each_dir

given:
  tree:
    rust:
      crates:
        domain:
          Cargo.toml: "[package]\nname = \"product-domain\"\n"
          README.md: "# product-domain\n"
          src:
            lib.rs: "pub const VERSION: &str = env!(\"CARGO_PKG_VERSION\");\n"
          tests:
            unit.rs: "#[test] fn ok() {}\n"
  config: |
    version: 1
    rules:
      - id: rust-unit-layout
        kind: for_each_dir
        select:
          - "rust/crates/*"
        when_iter: 'iter.has_file("Cargo.toml")'
        require:
          - kind: dir_exists
            paths: "{path}/src"
          - kind: dir_exists
            paths: "{path}/tests"
          - kind: dir_exists
            paths: "{path}/features"
          - kind: dir_contains
            select: "{path}/features"
            require: ["*.feature"]
          - kind: dir_contains
            select: "{path}/tests"
            require: ["*.rs"]
          - kind: file_exists
            paths: "{path}/README.md"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - { rule: rust-unit-layout, level: error }
