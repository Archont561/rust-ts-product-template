name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-and-docs:
    name: Repo Policies, Formatting & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi & Bun workspace
        uses: ./.github/actions/setup
        with:
          environment: default

      - name: Validate Tasknest graph, generated skill, docs templates & pixi-sandbox files
        run: |
          pixi run tools check
          pixi run tools skill --check
          pixi run tools run docs-sync
          pixi run tools run sandbox --action check
          pixi run tools run sandbox --action plan

      - name: Run repository policies, schemas & boundary checks (alint)
        run: pixi run tools run lint-repo

      - name: Run declarative alint policy test suite (.alint/tests)
        run: pixi run tools run test-policy

      - name: Run Biome formatting & TS/Svelte boundary checks
        run: pixi run tools run lint-ts

      - name: Lint Markdown & MDX files (rumdl)
        run: pixi run tools run lint-md

      - name: Lint Gherkin .feature specifications
        run: pixi run tools run lint-gherkin

      - name: Verify offline documentation links (lychee)
        run: pixi run tools run links

      - name: Lint top-level documentation prose (Vale)
        run: pixi run tools run lint-prose

  typescript:
    name: TypeScript Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi & Bun workspace
        uses: ./.github/actions/setup
        with:
          environment: js

      - name: Type-check all workspace packages via Tasknest
        run: pixi run -e js tools run --each typecheck

      - name: Run TypeScript unit tests with LCOV coverage
        run: pixi run -e js tools run test-ts --coverage

      - name: Upload TypeScript coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          flags: ts
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rust:
    name: Rust Clippy, Tests & Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain & cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-rust-workspace

      - name: Run cargo clippy (-D warnings)
        run: pixi run -e rust tools run lint-rust

      - name: Run cargo nextest workspace suite
        run: pixi run -e rust tools run test-rust

      - name: Verify Rust licenses, bans & sources (cargo-deny)
        run: pixi run -e rust tools run deny

      - name: Audit Cargo.lock advisories (cargo-audit)
        run: pixi run -e rust tools run audit

  web-docker:
    name: Web Alpine Container Smoke Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke-build apps/web static Alpine binary image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
