name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/actions/setup/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Probed first, before any Pixi solve or docs build: this repository is a template,
  # so clones that never enable Pages should skip cleanly instead of failing the
  # `Configure GitHub Pages` step with "Get Pages site failed ... Not Found".
  preflight:
    name: Check GitHub Pages Enablement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Query the GitHub Pages API
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          case "${status}" in
            200)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              echo "GitHub Pages is enabled; continuing with the build and deploy."
              ;;
            404)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::notice title=GitHub Pages not enabled::GET /repos/${GITHUB_REPOSITORY}/pages returned 404, so this repository has no Pages site configured. Skipping the Fumadocs build and deploy. Enable Pages under Settings -> Pages (source: GitHub Actions) to publish."
              ;;
            *)
              # A 403 here means the token lacks `pages: read`, not that Pages is off.
              # Failing loudly beats silently skipping a deploy on a permissions typo.
              echo "::error::Could not determine GitHub Pages status: GET /repos/${GITHUB_REPOSITORY}/pages returned HTTP ${status}. Refusing to guess; check that this job grants 'pages: read'."
              exit 1
              ;;
          esac

  build:
    name: Build Fumadocs Static Site
    needs: preflight
    if: ${{ needs.preflight.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi docs environment & Bun workspace
        uses: ./.github/actions/setup
        with:
          environment: docs

      - name: Verify docs download manifest & repository policies
        run: pixi run -e docs tools run quality lint-repo

      - name: Build static Fumadocs export (apps/docs/out)
        run: pixi run -e docs tools run docs build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
